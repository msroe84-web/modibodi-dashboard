name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble legacy root site
        run: |
          mkdir -p _site
          cp index.html BRAND.md CLAUDE.md Cafe24_Integration.gs _site/

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build dashboard-v2
        working-directory: web
        run: |
          npm ci
          npm run build
        env:
          VITE_APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          VITE_SECRET_TOKEN: ${{ secrets.SECRET_TOKEN }}

      - name: Overlay v2 build into /v2/
        run: |
          mkdir -p _site/v2
          cp -r web/dist/. _site/v2/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
